<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editor y Depurador C Educativo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Editor y depurador paso a paso de C para estudiantes.">
    <!-- Cargar el intérprete (ya existente) -->
    <script src="lexico.js"></script>
    <script src="parser.js"></script>
    <script src="interprete.js"></script>
    <script src="interp.js"></script>
    <script>
        // Tema guardado: se aplica antes de pintar. Si localStorage no está disponible, manda el tema del sistema.
        try {
            const temaGuardado = localStorage.getItem('chuchulucos-tema');
            if (temaGuardado === 'light' || temaGuardado === 'dark') {
                document.documentElement.setAttribute('data-theme', temaGuardado);
            }
        } catch (e) { /* sin acceso a localStorage: se usa el tema del sistema */ }
    </script>
    <style>
        :root {
            color-scheme: light dark;
            --bg-color: #ffffff;
            --text-color: #000;
            --panel-bg: #f5f5f5;
            --accent: #007acc;
            --accent-text: #005a9e;
            --highlight-bg: rgba(0,122,204,0.1);
            --error-bg: #ffdddd;
            --error-line-bg: #ffcccc;
            --gutter-bg: #e0e0e0;
            --gutter-color: #555;
            --var-chip-bg: #ddd;
            --var-chip-bg-changed: #ffecb3;
            --border: #ccc;
            --control-bg: #ffffff;
            --control-border: #aaa;
            --warn: #a35f00;
            --danger: #c62828;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                color-scheme: dark;
                --bg-color: #1e1e1e;
                --text-color: #d4d4d4;
                --panel-bg: #252525;
                --accent: #4daafc;
                --accent-text: #4daafc;
                --highlight-bg: rgba(77,170,252,0.2);
                --error-bg: #5a0000;
                --error-line-bg: #5a0000;
                --gutter-bg: #2d2d2d;
                --gutter-color: #aaa;
                --var-chip-bg: #333;
                --var-chip-bg-changed: #665c00;
                --border: #444;
                --control-bg: #333;
                --control-border: #666;
                --warn: #e0a000;
                --danger: #ef5350;
            }
        }
        :root[data-theme="light"] {
            color-scheme: light;
        }
        :focus-visible {
            outline: 2px solid var(--accent-text);
            outline-offset: 2px;
        }
        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg-color: #1e1e1e;
            --text-color: #d4d4d4;
            --panel-bg: #252525;
            --accent: #4daafc;
            --accent-text: #4daafc;
            --highlight-bg: rgba(77,170,252,0.2);
            --error-bg: #5a0000;
            --error-line-bg: #5a0000;
            --gutter-bg: #2d2d2d;
            --gutter-color: #aaa;
            --var-chip-bg: #333;
            --var-chip-bg-changed: #665c00;
            --border: #444;
            --control-bg: #333;
            --control-border: #666;
            --warn: #e0a000;
            --danger: #ef5350;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 8px;
        }

        @media (max-width: 600px) {
            .container { flex-direction: column; }
        }

        /* Panel izquierdo (editor) */
        .left {
            flex: 1 1 300px;
            background: var(--panel-bg);
            display: flex;
            flex-direction: column;
            min-width: 260px;
        }

        .editor-bar {
            display: flex;
            gap: 8px;
            padding: 8px;
            border-bottom: 1px solid var(--border);
            align-items: center;
        }
        .capacity {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 8px;
            font-size: 0.85em;
            border-bottom: 1px solid var(--border);
        }
        .capacity.full #capacity-text { font-weight: bold; }
        .capacity-bar {
            flex: 1;
            height: 8px;
            background: var(--gutter-bg);
            border-radius: 4px;
            overflow: hidden;
        }
        #capacity-fill {
            height: 100%;
            width: 0;
            background: var(--accent);
            transition: width 0.15s;
        }
        #capacity-fill.warn { background: var(--warn); }
        #capacity-fill.full { background: var(--danger); }
        #steps-fill {
            height: 100%;
            width: 0;
            background: var(--accent);
            transition: width 0.15s;
        }
        #steps-fill.warn { background: var(--warn); }
        #steps-fill.full { background: var(--danger); }
        #vars-fill, #anid-fill, #prof-fill {
            height: 100%;
            width: 0;
            background: var(--accent);
            transition: width 0.15s;
        }
        #vars-fill.warn, #anid-fill.warn, #prof-fill.warn { background: var(--warn); }
        #vars-fill.full, #anid-fill.full, #prof-fill.full { background: var(--danger); }
        .editor-bar button {
            padding: 4px 8px;
            font-size: 0.9em;
            cursor: pointer;
            border: 1px solid var(--control-border);
            border-radius: 4px;
            background: var(--control-bg);
            color: var(--text-color);
        }
        .editor-bar .speed-control {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        #speed { width: 100px; }

        /* Contenedor del editor con numeración de líneas */
        .editor-body {
            display: flex;
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        #gutter {
            width: 40px;
            background: var(--gutter-bg);
            color: var(--gutter-color);
            text-align: right;
            padding: 8px 4px;
            font-family: monospace;
            font-size: 0.9em;
            user-select: none;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #gutter div {
            padding: 0 4px;
            line-height: 1.5;
            white-space: pre;
            height: 1.5em;
        }
        #gutter div.active {
            background: var(--highlight-bg);
            color: var(--text-color);
            font-weight: bold;
        }
        #gutter div.error-line {
            background: var(--error-line-bg);
        }

        .code-area {
            flex: 1;
            position: relative;
            background: transparent;
        }
        #code-display {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 8px;
            font-family: monospace;
            white-space: pre;
            overflow: hidden;
            pointer-events: none;
            background: transparent;
        }
        .code-line {
            height: 1.5em;
            line-height: 1.5;
            padding-left: 8px;
        }
        .code-line.active {
            background: var(--highlight-bg);
        }
        .code-line.error-line {
            background: var(--error-line-bg);
        }

        #code {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            resize: none;
            border: none;
            background: transparent;
            color: transparent; /* ocultar texto para que el #code-display lo muestre */
            caret-color: var(--text-color);
            padding: 8px;
            margin: 0;
            font-family: monospace;
            font-size: 1em;
            line-height: 1.5;
            white-space: pre;
            overflow: auto;
            z-index: 0;
        }

        /* Panel derecho (ejecución) */
        .right {
            flex: 1 1 300px;
            background: var(--panel-bg);
            display: flex;
            flex-direction: column;
            min-width: 260px;
        }
        .exec-top {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            border-bottom: 1px solid var(--border);
        }
        #counter {
            font-weight: bold;
            white-space: nowrap;
        }
        #current-line {
            font-family: monospace;
            background: var(--panel-bg);
            padding: 4px 8px;
            border-left: 3px solid var(--accent);
            overflow-x: auto;
            flex: 1;
            white-space: pre;
        }
        #output {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            padding: 8px;
            overflow-x: auto;
            font-family: monospace;
            white-space: pre;
            margin: 8px;
        }
        #vars {
            padding: 0 8px 8px;
            overflow-y: auto;
        }
        .var-group {
            margin-bottom: 12px;
        }
        .var-group-title {
            font-weight: bold;
            margin-bottom: 4px;
            color: var(--accent-text);
        }
        .var-group.current > .var-group-title {
            text-decoration: underline;
        }
        .var-chip {
            display: inline-block;
            background: var(--var-chip-bg);
            border-radius: 12px;
            padding: 2px 8px;
            margin: 2px;
            font-size: 0.85em;
            white-space: nowrap;
        }
        .var-chip.changed {
            background: var(--var-chip-bg-changed);
            font-weight: bold;
        }
        #error {
            background: var(--error-bg);
            color: var(--text-color);
            padding: 8px;
            margin: 8px;
            border-radius: 4px;
        }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
        .hidden { display: none; }
    </style>
</head>
<body>
<h1 class="sr-only">Editor y depurador de C</h1>

<main class="container">
    <!-- Panel izquierdo: editor -->
    <div class="left" id="editor">
        <div class="editor-bar">
            <button id="run-btn" title="Ejecutar/Play">▶ Ejecutar</button>
            <button id="play-btn" title="Reproducir" aria-label="Play (reproducir)">⏵ Play</button>
            <button id="pause-btn" title="Pausar" aria-label="Pausar">⏸ Pausa</button>
            <button id="prev-btn" title="Anterior" aria-label="Paso anterior">◀ Anterior</button>
            <button id="next-btn" title="Siguiente" aria-label="Paso siguiente">⏭ Siguiente</button>
            <button id="reset-btn" title="Reiniciar" aria-label="Reiniciar">⟲ Reiniciar</button>
            <div class="speed-control">
                <label for="speed">Velocidad (ms):</label>
                <input type="range" id="speed" min="50" max="1000" value="500">
            </div>
            <button id="theme-btn" type="button" aria-pressed="false" aria-label="Tema oscuro">◐ Tema oscuro</button>
        </div>
        <div class="capacity">
            <span id="capacity-text"></span>
            <div class="capacity-bar" role="meter" aria-label="Espacio para código" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div id="capacity-fill"></div>
            </div>
        </div>
        <div class="capacity">
            <span id="steps-text">0 / 50000 pasos</span>
            <div class="capacity-bar" role="meter" aria-label="Pasos de la última ejecución" aria-valuemin="0" aria-valuemax="50000" aria-valuenow="0">
                <div id="steps-fill"></div>
            </div>
        </div>
        <div class="capacity">
            <span id="vars-text">0 / 20 variables</span>
            <div class="capacity-bar" role="meter" aria-label="Variables declaradas" aria-valuemin="0" aria-valuemax="20" aria-valuenow="0">
                <div id="vars-fill"></div>
            </div>
        </div>
        <div class="capacity">
            <span id="anid-text">0 / 3 niveles de anidamiento</span>
            <div class="capacity-bar" role="meter" aria-label="Niveles de anidamiento" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0">
                <div id="anid-fill"></div>
            </div>
        </div>
        <div class="capacity">
            <span id="prof-text">0 / 200 niveles de llamada</span>
            <div class="capacity-bar" role="meter" aria-label="Profundidad de llamadas de la última ejecución" aria-valuemin="0" aria-valuemax="200" aria-valuenow="0">
                <div id="prof-fill"></div>
            </div>
        </div>
        <div class="editor-body">
            <div id="gutter"></div>
            <pre id="code-display"></pre>
            <textarea id="code" spellcheck="false"></textarea>
        </div>
    </div>

    <!-- Panel derecho: visualización de ejecución -->
    <div class="right">
        <div class="exec-top">
            <span id="counter"></span>
            <div id="current-line"></div>
        </div>
        <p id="status" class="sr-only" role="status"></p>
        <pre id="output"></pre>
        <div id="vars"></div>
        <div id="error" class="hidden" role="alert"></div>
    </div>
</main>

<script>
    // Referencias DOM
    const code = document.getElementById('code');
    const gutter = document.getElementById('gutter');
    const codeDisplay = document.getElementById('code-display');
    code.addEventListener('scroll', () => {
        gutter.scrollTop = code.scrollTop;
        codeDisplay.scrollTop = code.scrollTop;
        codeDisplay.scrollLeft = code.scrollLeft;
    });
    code.addEventListener('keydown', (e) => {
        // Ctrl/Cmd+Enter ejecuta. Tab no se captura para no atrapar el teclado.
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            onRun();
        }
    });

    const runBtn = document.getElementById('run-btn');
    const playBtn = document.getElementById('play-btn');
    const pauseBtn = document.getElementById('pause-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const resetBtn = document.getElementById('reset-btn');
    const speedSlider = document.getElementById('speed');

    const counterDisplay = document.getElementById('counter');
    const currentLineDisplay = document.getElementById('current-line');
    const outputDisplay = document.getElementById('output');
    const statusDisplay = document.getElementById('status');
    const varsDisplay = document.getElementById('vars');
    const errorDisplay = document.getElementById('error');

    // Interruptor de tema: alterna data-theme en <html> y recuerda la elección si el navegador lo permite.
    const themeBtn = document.getElementById('theme-btn');
    const temaSistema = window.matchMedia('(prefers-color-scheme: dark)');
    function temaEfectivo() {
        const forzado = document.documentElement.getAttribute('data-theme');
        if (forzado === 'light' || forzado === 'dark') return forzado;
        return temaSistema.matches ? 'dark' : 'light';
    }
    function pintarTema() {
        themeBtn.setAttribute('aria-pressed', String(temaEfectivo() === 'dark'));
    }
    themeBtn.addEventListener('click', () => {
        const nuevo = temaEfectivo() === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', nuevo);
        try {
            localStorage.setItem('chuchulucos-tema', nuevo);
        } catch (e) { /* sin persistencia: la elección dura solo esta visita */ }
        pintarTema();
    });
    if (temaSistema.addEventListener) {
        temaSistema.addEventListener('change', pintarTema);
    } else {
        temaSistema.addListener(pintarTema); // Safari anterior a 14
    }
    pintarTema();

    // Estado
    let sourceCode = '';
    let steps = null;
    let currentStepIndex = 0;
    let isPlaying = false;
    let playInterval = null;
    let previousVars = null;

    // Elementos para numeración de líneas y resaltado del editor
    let lineNumElems = [];
    let codeLineElems = [];

    // Código de ejemplo inicial
    // Tope de líneas: los programas de inicio son cortos.
    const MAX_LINEAS = 100;
    const MAX_VARIABLES = 20;
    const MAX_ANIDAMIENTO = 3;
    const MAX_PROFUNDIDAD = 200;
    const capacityFill = document.getElementById('capacity-fill');
    const capacityText = document.getElementById('capacity-text');
    const stepsFill = document.getElementById('steps-fill');
    const stepsText = document.getElementById('steps-text');
    const stepsMeter = stepsFill.parentElement;
    const MAX_PASOS_DEFAULT = 50000;
    const capacityMeter = document.querySelector('.capacity-bar');
    let ultimoCodigoValido = '';

    function contarLineas(texto) {
        return texto.split('\n').length;
    }

    function actualizarCapacidad() {
        const n = contarLineas(code.value);
        const proporcion = n / MAX_LINEAS;
        capacityFill.style.width = Math.min(100, Math.round(proporcion * 100)) + '%';
        capacityFill.className = n >= MAX_LINEAS ? 'full' : (proporcion >= 0.8 ? 'warn' : '');
        capacityText.textContent = `${n} / ${MAX_LINEAS} líneas`;
        capacityMeter.setAttribute('aria-valuenow', n);
        capacityMeter.setAttribute('aria-valuetext', `${n} de ${MAX_LINEAS} líneas`);
        capacityMeter.parentElement.classList.toggle('full', n >= MAX_LINEAS);
    }

    const sampleCode = `int sum(int n) {
    int total = 0;
    for (int i = 0; i < n; i++) {
        total += i;
        printf("%d\\n", i);
    }
    return total;
}

int main() {
    int result = sum(5);
    printf("Result: %d\\n", result);
    return 0;
}`;
    code.value = sampleCode;
    sourceCode = sampleCode;
    ultimoCodigoValido = sampleCode;
    actualizarCapacidad();
    actualizarMedidoresCodigo();
    // Actualizar numeración del editor inicialmente
    updateEditorDisplay();

    // Eventos
    code.addEventListener('input', () => {
        if (contarLineas(code.value) > MAX_LINEAS) {
            // Se pasó del tope (escritura o pegado): volver al último código válido.
            const pos = Math.max(0, code.selectionStart - 1);
            code.value = ultimoCodigoValido;
            code.selectionStart = code.selectionEnd = Math.min(pos, code.value.length);
        }
        ultimoCodigoValido = code.value;
        actualizarCapacidad();
        actualizarMedidoresCodigo();
        sourceCode = code.value;
        updateEditorDisplay();
        // invalidar traza cuando se modifica el código
        invalidateTrace();
    });

    runBtn.addEventListener('click', onRun);
    playBtn.addEventListener('click', onPlay);
    pauseBtn.addEventListener('click', onPause);
    prevBtn.addEventListener('click', onPrev);
    nextBtn.addEventListener('click', onNext);
    resetBtn.addEventListener('click', onReset);
    speedSlider.addEventListener('input', () => {
        if (isPlaying) {
            onPause();
            onPlay();
        }
    });

    // Funciones de control -------------------------------------------------

    function invalidateTrace() {
        steps = null;
        currentStepIndex = 0;
        if (playInterval) {
            clearInterval(playInterval);
            playInterval = null;
        }
        isPlaying = false;
        counterDisplay.textContent = '';
        currentLineDisplay.textContent = '';
        outputDisplay.textContent = '';
        varsDisplay.innerHTML = '';
        hideError();
    }

    // Pinta un medidor: valor usado frente a su tope, con el mismo color que las demás barras.
    function pintarMedidor(id, valor, tope, texto) {
        const fill = document.getElementById(id + '-fill');
        const meter = fill.parentElement;
        const usados = Math.min(valor, tope);
        const proporcion = usados / tope;
        fill.style.width = Math.round(proporcion * 100) + '%';
        fill.className = usados >= tope ? 'full' : (proporcion >= 0.8 ? 'warn' : '');
        document.getElementById(id + '-text').textContent = texto(usados);
        meter.setAttribute('aria-valuenow', usados);
        meter.setAttribute('aria-valuetext', texto(usados));
    }

    // Variables y anidamiento se miden al escribir; si el código aún no es válido, se mantiene el último resultado.
    function actualizarMedidoresCodigo() {
        let r;
        try {
            r = CInterp.analizar(code.value);
        } catch (e) {
            return;
        }
        pintarMedidor('vars', r.variables, MAX_VARIABLES, n => `${n} / ${MAX_VARIABLES} variables`);
        pintarMedidor('anid', r.anidamiento, MAX_ANIDAMIENTO, n => `${n} / ${MAX_ANIDAMIENTO} niveles de anidamiento`);
    }

    function mostrarPasos(pasos, limite) {
        const usados = Math.min(pasos, limite);
        const proporcion = usados / limite;
        stepsFill.style.width = Math.round(proporcion * 100) + '%';
        stepsFill.className = usados >= limite ? 'full' : (proporcion >= 0.8 ? 'warn' : '');
        stepsText.textContent = `${usados} / ${limite} pasos`;
        stepsMeter.setAttribute('aria-valuenow', usados);
        stepsMeter.setAttribute('aria-valuemax', limite);
        stepsMeter.setAttribute('aria-valuetext', `${pasos} de ${limite} pasos`);
    }

    function onRun() {
        invalidateTrace();
        try {
            const result = CInterp.run(sourceCode);
            mostrarPasos(result.pasos || 0, result.limite || MAX_PASOS_DEFAULT);
            pintarMedidor('prof', result.profundidad || 0, MAX_PROFUNDIDAD, n => `${n} / ${MAX_PROFUNDIDAD} niveles de llamada`);
            if (result.error) {
                showError(result.error, result.errorLine);
                steps = [];
            } else {
                steps = result.steps;
                hideError();
            }
            currentStepIndex = 0;
            previousVars = null;
            if (steps && steps.length > 0) {
                updateUI();
                statusDisplay.textContent = `Traza lista: ${steps.length} pasos.`;
                isPlaying = true;
                startStepLoop();
            } else {
                counterDisplay.textContent = 'Sin pasos.';
            }
        } catch (e) {
            showError(e.message, -1);
        }
    }

    function startStepLoop() {
        if (!isPlaying || steps == null || steps.length === 0) return;
        const intervalMs = parseInt(speedSlider.value, 10);
        playInterval = setInterval(() => {
            if (currentStepIndex >= steps.length - 1) {
                // Finalizado
                statusDisplay.textContent = 'Ejecución terminada.';
                isPlaying = false;
                clearInterval(playInterval);
                playInterval = null;
            } else {
                currentStepIndex++;
                updateUI();
            }
        }, intervalMs);
    }

    function onPlay() {
        if (!steps) {
            // Si no hay traza, ejecutar primero
            onRun();
            return;
        }
        if (isPlaying) return;
        isPlaying = true;
        startStepLoop();
    }

    function onPause() {
        if (playInterval) {
            clearInterval(playInterval);
            playInterval = null;
        }
        isPlaying = false;
    }

    function onPrev() {
        if (!steps || currentStepIndex <= 0) return;
        currentStepIndex--;
        updateUI();
    }

    function onNext() {
        if (!steps || currentStepIndex >= steps.length - 1) return;
        currentStepIndex++;
        updateUI();
    }

    function onReset() {
        if (!steps) return;
        currentStepIndex = 0;
        previousVars = null;
        updateUI();
        onPause();
    }

    function updateUI() {
        if (!steps || !steps.length) return;
        const step = steps[currentStepIndex];

        // Contador de pasos
        counterDisplay.textContent = `Paso ${currentStepIndex + 1} de ${steps.length}`;

        // Mostrar línea de código
        let lineText = step.line;
        if (typeof lineText !== 'string') {
            const lines = sourceCode.split('\n');
            const ln = lineText;
            if (ln >= 1 && ln <= lines.length) {
                lineText = lines[ln - 1];
            } else {
                lineText = '';
            }
        }
        currentLineDisplay.textContent = lineText;

        // Salida STDOUT
        outputDisplay.textContent = step.out ?? '';

        // Mostrar variables
        renderVars(step.vars);

        // Resaltar línea en el editor
        let lineNumber = -1;
        if (typeof step.line === 'number') {
            lineNumber = step.line;
        } else if (typeof step.line === 'string') {
            lineNumber = parseInt(step.line, 10);
        }
        if (!isNaN(lineNumber)) {
            highlightEditorLine(lineNumber);
        }
    }

    function renderVars(varsArray) {
        // Agrupar por función
        const grouped = {};
        for (const v of varsArray) {
            const k = v.fn || 'global';
            if (!grouped[k]) grouped[k] = [];
            grouped[k].push(v);
        }

        varsDisplay.innerHTML = '';
        const currentFn = steps[currentStepIndex].fn || 'global';

        for (const fnName in grouped) {
            const groupDiv = document.createElement('div');
            groupDiv.className = 'var-group';
            if (fnName === currentFn) groupDiv.classList.add('current');

            const label = document.createElement('div');
            label.className = 'var-group-title';
            label.textContent = fnName === 'global' ? 'Global' : fnName;
            groupDiv.appendChild(label);

            for (const varObj of grouped[fnName]) {
                const chip = document.createElement('span');
                chip.className = 'var-chip';
                const displayVal = formatVarValue(varObj);
                chip.textContent = `${varObj.name} = ${displayVal}`;

                if (previousVars) {
                    const prevVar = findVarInArray(previousVars, varObj.name, varObj.fn);
                    if (prevVar && !areValuesEqual(prevVar, varObj)) {
                        chip.classList.add('changed');
                    }
                }
                groupDiv.appendChild(chip);
            }

            varsDisplay.appendChild(groupDiv);
        }

        previousVars = varsArray;
    }

    function formatVarValue(v) {
        if (v.arr) {
            return '[' + v.v.map(num => num.toString()).join(', ') + ']';
        }
        if (v.ty === 'char') {
            return `'${String.fromCharCode(v.v)}' (${v.v})`;
        }
        return v.v.toString();
    }

    function findVarInArray(vars, name, fn) {
        for (const v of vars) {
            if (v.name === name && v.fn === fn) return v;
        }
        return null;
    }

    function areValuesEqual(a, b) {
        if (a.ty !== b.ty) return false;
        if (a.arr && b.arr) {
            if (a.v.length !== b.v.length) return false;
            for (let i = 0; i < a.v.length; i++) {
                if (a.v[i] !== b.v[i]) return false;
            }
            return true;
        }
        if (!a.arr && !b.arr) {
            return a.v === b.v;
        }
        return false;
    }

    function showError(msg, line) {
        errorDisplay.classList.remove('hidden');
        errorDisplay.textContent = `[Error] ${msg}`;
        if (line >= 1) {
            errorDisplay.textContent += ` en línea ${line}`;
        }

        // Resaltar línea en rojo en el editor si la línea es válida
        if (line >= 1) {
            if (line <= codeLineElems.length) {
                codeLineElems[line - 1].classList.add('error-line');
            }
            if (line <= lineNumElems.length) {
                lineNumElems[line - 1].classList.add('error-line');
            }
        }
    }

    function hideError() {
        errorDisplay.classList.add('hidden');
        codeLineElems.forEach(el => el.classList.remove('error-line'));
        lineNumElems.forEach(el => el.classList.remove('error-line'));
    }

    function highlightEditorLine(lineNumber) {
        // Quitar clases activas de todos los elementos
        lineNumElems.forEach(el => el.classList.remove('active'));
        codeLineElems.forEach(el => el.classList.remove('active'));

        if (lineNumber >= 1 && lineNumber <= lineNumElems.length) {
            lineNumElems[lineNumber - 1].classList.add('active');
            codeLineElems[lineNumber - 1].classList.add('active');
        }
    }

    // -------- Actualizar numeración y área de visualización del editor --------
    function updateEditorDisplay() {
        const lines = sourceCode.split('\n');
        updateGutter(lines);
        updateCodeDisplay(lines);
    }

    function updateGutter(lines) {
        gutter.innerHTML = '';
        lineNumElems = [];
        for (let i = 0; i < lines.length; i++) {
            const ln = document.createElement('div');
            ln.className = 'line-num';
            ln.textContent = (i + 1).toString();
            gutter.appendChild(ln);
            lineNumElems.push(ln);
        }
    }

    function updateCodeDisplay(lines) {
        codeDisplay.innerHTML = '';
        codeLineElems = [];
        for (let i = 0; i < lines.length; i++) {
            const wrap = document.createElement('div');
            wrap.className = 'code-line';
            wrap.textContent = lines[i];
            codeDisplay.appendChild(wrap);
            codeLineElems.push(wrap);
        }
    }
</script>

</body>
</html>
