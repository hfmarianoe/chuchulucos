<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editor y Depurador C Educativo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Editor y depurador paso a paso de C para estudiantes.">
    <!-- Cargar el intérprete (ya existente) -->
    <script src="interp.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000;
            --panel-bg: #f5f5f5;
            --accent: #007acc;
            --highlight-bg: rgba(0,122,204,0.1);
            --error-bg: #ffdddd;
            --error-line-bg: #ffcccc;
            --gutter-bg: #e0e0e0;
            --gutter-color: #555;
            --var-chip-bg: #ddd;
            --var-chip-bg-changed: #ffecb3;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #1e1e1e;
                --text-color: #d4d4d4;
                --panel-bg: #252525;
                --accent: #4daafc;
                --highlight-bg: rgba(77,170,252,0.2);
                --error-bg: #5a0000;
                --error-line-bg: #5a0000;
                --gutter-bg: #2d2d2d;
                --gutter-color: #aaa;
                --var-chip-bg: #333;
                --var-chip-bg-changed: #665c00;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 8px;
        }

        @media (max-width: 600px) {
            .container { flex-direction: column; }
        }

        /* Panel izquierdo (editor) */
        .left {
            flex: 1 1 300px;
            background: var(--panel-bg);
            display: flex;
            flex-direction: column;
            min-width: 260px;
        }

        .editor-bar {
            display: flex;
            gap: 8px;
            padding: 8px;
            border-bottom: 1px solid #ccc;
            align-items: center;
        }
        .editor-bar button {
            padding: 4px 8px;
            font-size: 0.9em;
            cursor: pointer;
            border: 1px solid #aaa;
            border-radius: 4px;
            background: #fff;
        }
        .editor-bar .speed-control {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        #speed { width: 100px; }

        /* Contenedor del editor con numeración de líneas */
        .editor-body {
            display: flex;
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        #gutter {
            width: 40px;
            background: var(--gutter-bg);
            color: var(--gutter-color);
            text-align: right;
            padding: 8px 4px;
            font-family: monospace;
            font-size: 0.9em;
            user-select: none;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #gutter div {
            padding: 0 4px;
            line-height: 1.5;
            white-space: pre;
            height: 1.5em;
        }
        #gutter div.active {
            background: var(--highlight-bg);
            color: var(--text-color);
            font-weight: bold;
        }
        #gutter div.error-line {
            background: var(--error-line-bg);
        }

        .code-area {
            flex: 1;
            position: relative;
            background: transparent;
        }
        #code-display {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 8px;
            font-family: monospace;
            white-space: pre;
            overflow: hidden;
            pointer-events: none;
            background: transparent;
        }
        .code-line {
            height: 1.5em;
            line-height: 1.5;
            padding-left: 8px;
        }
        .code-line.active {
            background: var(--highlight-bg);
        }
        .code-line.error-line {
            background: var(--error-line-bg);
        }

        #code {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            resize: none;
            border: none;
            background: transparent;
            color: transparent; /* ocultar texto para que el #code-display lo muestre */
            caret-color: var(--text-color);
            padding: 8px;
            margin: 0;
            font-family: monospace;
            font-size: 1em;
            line-height: 1.5;
            white-space: pre;
            overflow: auto;
            z-index: 0;
        }

        /* Panel derecho (ejecución) */
        .right {
            flex: 1 1 300px;
            background: var(--panel-bg);
            display: flex;
            flex-direction: column;
            min-width: 260px;
        }
        .exec-top {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            border-bottom: 1px solid #ccc;
        }
        #counter {
            font-weight: bold;
            white-space: nowrap;
        }
        #current-line {
            font-family: monospace;
            background: var(--panel-bg);
            padding: 4px 8px;
            border-left: 3px solid var(--accent);
            overflow-x: auto;
            flex: 1;
            white-space: pre;
        }
        #output {
            background: var(--panel-bg);
            border: 1px solid #ccc;
            padding: 8px;
            overflow-x: auto;
            font-family: monospace;
            white-space: pre;
            margin: 8px;
        }
        #vars {
            padding: 0 8px 8px;
            overflow-y: auto;
        }
        .var-group {
            margin-bottom: 12px;
        }
        .var-group-title {
            font-weight: bold;
            margin-bottom: 4px;
            color: var(--accent);
        }
        .var-group.current > .var-group-title {
            text-decoration: underline;
        }
        .var-chip {
            display: inline-block;
            background: var(--var-chip-bg);
            border-radius: 12px;
            padding: 2px 8px;
            margin: 2px;
            font-size: 0.85em;
            white-space: nowrap;
        }
        .var-chip.changed {
            background: var(--var-chip-bg-changed);
            font-weight: bold;
        }
        #error {
            background: var(--error-bg);
            color: var(--text-color);
            padding: 8px;
            margin: 8px;
            border-radius: 4px;
        }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
        .hidden { display: none; }
    </style>
</head>
<body>
<h1 class="sr-only">Editor y depurador de C</h1>

<main class="container">
    <!-- Panel izquierdo: editor -->
    <div class="left" id="editor">
        <div class="editor-bar">
            <button id="run-btn" title="Ejecutar/Play">▶ Ejecutar</button>
            <button id="play-btn" title="Reproducir" aria-label="Play (reproducir)">⏵ Play</button>
            <button id="pause-btn" title="Pausar" aria-label="Pausar">⏸ Pausa</button>
            <button id="prev-btn" title="Anterior" aria-label="Paso anterior">◀ Anterior</button>
            <button id="next-btn" title="Siguiente" aria-label="Paso siguiente">⏭ Siguiente</button>
            <button id="reset-btn" title="Reiniciar" aria-label="Reiniciar">⟲ Reiniciar</button>
            <div class="speed-control">
                <label for="speed">Velocidad (ms):</label>
                <input type="range" id="speed" min="50" max="1000" value="500">
            </div>
        </div>
        <div class="editor-body">
            <div id="gutter"></div>
            <pre id="code-display"></pre>
            <textarea id="code" spellcheck="false"></textarea>
        </div>
    </div>

    <!-- Panel derecho: visualización de ejecución -->
    <div class="right">
        <div class="exec-top">
            <span id="counter"></span>
            <div id="current-line"></div>
        </div>
        <p id="status" class="sr-only" role="status"></p>
        <pre id="output"></pre>
        <div id="vars"></div>
        <div id="error" class="hidden" role="alert"></div>
    </div>
</main>

<script>
    // Referencias DOM
    const code = document.getElementById('code');
    const gutter = document.getElementById('gutter');
    const codeDisplay = document.getElementById('code-display');
    code.addEventListener('scroll', () => {
        gutter.scrollTop = code.scrollTop;
        codeDisplay.scrollTop = code.scrollTop;
        codeDisplay.scrollLeft = code.scrollLeft;
    });
    code.addEventListener('keydown', (e) => {
        // Ctrl/Cmd+Enter ejecuta. Tab no se captura para no atrapar el teclado.
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            onRun();
        }
    });

    const runBtn = document.getElementById('run-btn');
    const playBtn = document.getElementById('play-btn');
    const pauseBtn = document.getElementById('pause-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const resetBtn = document.getElementById('reset-btn');
    const speedSlider = document.getElementById('speed');

    const counterDisplay = document.getElementById('counter');
    const currentLineDisplay = document.getElementById('current-line');
    const outputDisplay = document.getElementById('output');
    const statusDisplay = document.getElementById('status');
    const varsDisplay = document.getElementById('vars');
    const errorDisplay = document.getElementById('error');

    // Estado
    let sourceCode = '';
    let steps = null;
    let currentStepIndex = 0;
    let isPlaying = false;
    let playInterval = null;
    let previousVars = null;

    // Elementos para numeración de líneas y resaltado del editor
    let lineNumElems = [];
    let codeLineElems = [];

    // Código de ejemplo inicial
    const sampleCode = `int sum(int n) {
    int total = 0;
    for (int i = 0; i < n; i++) {
        total += i;
        printf("%d\\n", i);
    }
    return total;
}

int main() {
    int result = sum(5);
    printf("Result: %d\\n", result);
    return 0;
}`;
    code.value = sampleCode;
    sourceCode = sampleCode;
    // Actualizar numeración del editor inicialmente
    updateEditorDisplay();

    // Eventos
    code.addEventListener('input', () => {
        sourceCode = code.value;
        updateEditorDisplay();
        // invalidar traza cuando se modifica el código
        invalidateTrace();
    });

    runBtn.addEventListener('click', onRun);
    playBtn.addEventListener('click', onPlay);
    pauseBtn.addEventListener('click', onPause);
    prevBtn.addEventListener('click', onPrev);
    nextBtn.addEventListener('click', onNext);
    resetBtn.addEventListener('click', onReset);
    speedSlider.addEventListener('input', () => {
        if (isPlaying) {
            onPause();
            onPlay();
        }
    });

    // Funciones de control -------------------------------------------------

    function invalidateTrace() {
        steps = null;
        currentStepIndex = 0;
        if (playInterval) {
            clearInterval(playInterval);
            playInterval = null;
        }
        isPlaying = false;
        counterDisplay.textContent = '';
        currentLineDisplay.textContent = '';
        outputDisplay.textContent = '';
        varsDisplay.innerHTML = '';
        hideError();
    }

    function onRun() {
        invalidateTrace();
        try {
            const result = CInterp.run(sourceCode);
            if (result.error) {
                showError(result.error, result.errorLine);
                steps = [];
            } else {
                steps = result.steps;
                hideError();
            }
            currentStepIndex = 0;
            previousVars = null;
            if (steps && steps.length > 0) {
                updateUI();
                statusDisplay.textContent = `Traza lista: ${steps.length} pasos.`;
                isPlaying = true;
                startStepLoop();
            } else {
                counterDisplay.textContent = 'Sin pasos.';
            }
        } catch (e) {
            showError(e.message, -1);
        }
    }

    function startStepLoop() {
        if (!isPlaying || steps == null || steps.length === 0) return;
        const intervalMs = parseInt(speedSlider.value, 10);
        playInterval = setInterval(() => {
            if (currentStepIndex >= steps.length - 1) {
                // Finalizado
                statusDisplay.textContent = 'Ejecución terminada.';
                isPlaying = false;
                clearInterval(playInterval);
                playInterval = null;
            } else {
                currentStepIndex++;
                updateUI();
            }
        }, intervalMs);
    }

    function onPlay() {
        if (!steps) {
            // Si no hay traza, ejecutar primero
            onRun();
            return;
        }
        if (isPlaying) return;
        isPlaying = true;
        startStepLoop();
    }

    function onPause() {
        if (playInterval) {
            clearInterval(playInterval);
            playInterval = null;
        }
        isPlaying = false;
    }

    function onPrev() {
        if (!steps || currentStepIndex <= 0) return;
        currentStepIndex--;
        updateUI();
    }

    function onNext() {
        if (!steps || currentStepIndex >= steps.length - 1) return;
        currentStepIndex++;
        updateUI();
    }

    function onReset() {
        if (!steps) return;
        currentStepIndex = 0;
        previousVars = null;
        updateUI();
        onPause();
    }

    function updateUI() {
        if (!steps || !steps.length) return;
        const step = steps[currentStepIndex];

        // Contador de pasos
        counterDisplay.textContent = `Paso ${currentStepIndex + 1} de ${steps.length}`;

        // Mostrar línea de código
        let lineText = step.line;
        if (typeof lineText !== 'string') {
            const lines = sourceCode.split('\n');
            const ln = lineText;
            if (ln >= 1 && ln <= lines.length) {
                lineText = lines[ln - 1];
            } else {
                lineText = '';
            }
        }
        currentLineDisplay.textContent = lineText;

        // Salida STDOUT
        outputDisplay.textContent = step.out ?? '';

        // Mostrar variables
        renderVars(step.vars);

        // Resaltar línea en el editor
        let lineNumber = -1;
        if (typeof step.line === 'number') {
            lineNumber = step.line;
        } else if (typeof step.line === 'string') {
            lineNumber = parseInt(step.line, 10);
        }
        if (!isNaN(lineNumber)) {
            highlightEditorLine(lineNumber);
        }
    }

    function renderVars(varsArray) {
        // Agrupar por función
        const grouped = {};
        for (const v of varsArray) {
            const k = v.fn || 'global';
            if (!grouped[k]) grouped[k] = [];
            grouped[k].push(v);
        }

        varsDisplay.innerHTML = '';
        const currentFn = steps[currentStepIndex].fn || 'global';

        for (const fnName in grouped) {
            const groupDiv = document.createElement('div');
            groupDiv.className = 'var-group';
            if (fnName === currentFn) groupDiv.classList.add('current');

            const label = document.createElement('div');
            label.className = 'var-group-title';
            label.textContent = fnName === 'global' ? 'Global' : fnName;
            groupDiv.appendChild(label);

            for (const varObj of grouped[fnName]) {
                const chip = document.createElement('span');
                chip.className = 'var-chip';
                const displayVal = formatVarValue(varObj);
                chip.textContent = `${varObj.name} = ${displayVal}`;

                if (previousVars) {
                    const prevVar = findVarInArray(previousVars, varObj.name, varObj.fn);
                    if (prevVar && !areValuesEqual(prevVar, varObj)) {
                        chip.classList.add('changed');
                    }
                }
                groupDiv.appendChild(chip);
            }

            varsDisplay.appendChild(groupDiv);
        }

        previousVars = varsArray;
    }

    function formatVarValue(v) {
        if (v.arr) {
            return '[' + v.v.map(num => num.toString()).join(', ') + ']';
        }
        if (v.ty === 'char') {
            return `'${String.fromCharCode(v.v)}' (${v.v})`;
        }
        return v.v.toString();
    }

    function findVarInArray(vars, name, fn) {
        for (const v of vars) {
            if (v.name === name && v.fn === fn) return v;
        }
        return null;
    }

    function areValuesEqual(a, b) {
        if (a.ty !== b.ty) return false;
        if (a.arr && b.arr) {
            if (a.v.length !== b.v.length) return false;
            for (let i = 0; i < a.v.length; i++) {
                if (a.v[i] !== b.v[i]) return false;
            }
            return true;
        }
        if (!a.arr && !b.arr) {
            return a.v === b.v;
        }
        return false;
    }

    function showError(msg, line) {
        errorDisplay.classList.remove('hidden');
        errorDisplay.textContent = `[Error] ${msg}`;
        if (line >= 1) {
            errorDisplay.textContent += ` en línea ${line}`;
        }

        // Resaltar línea en rojo en el editor si la línea es válida
        if (line >= 1) {
            if (line <= codeLineElems.length) {
                codeLineElems[line - 1].classList.add('error-line');
            }
            if (line <= lineNumElems.length) {
                lineNumElems[line - 1].classList.add('error-line');
            }
        }
    }

    function hideError() {
        errorDisplay.classList.add('hidden');
        codeLineElems.forEach(el => el.classList.remove('error-line'));
        lineNumElems.forEach(el => el.classList.remove('error-line'));
    }

    function highlightEditorLine(lineNumber) {
        // Quitar clases activas de todos los elementos
        lineNumElems.forEach(el => el.classList.remove('active'));
        codeLineElems.forEach(el => el.classList.remove('active'));

        if (lineNumber >= 1 && lineNumber <= lineNumElems.length) {
            lineNumElems[lineNumber - 1].classList.add('active');
            codeLineElems[lineNumber - 1].classList.add('active');
        }
    }

    // -------- Actualizar numeración y área de visualización del editor --------
    function updateEditorDisplay() {
        const lines = sourceCode.split('\n');
        updateGutter(lines);
        updateCodeDisplay(lines);
    }

    function updateGutter(lines) {
        gutter.innerHTML = '';
        lineNumElems = [];
        for (let i = 0; i < lines.length; i++) {
            const ln = document.createElement('div');
            ln.className = 'line-num';
            ln.textContent = (i + 1).toString();
            gutter.appendChild(ln);
            lineNumElems.push(ln);
        }
    }

    function updateCodeDisplay(lines) {
        codeDisplay.innerHTML = '';
        codeLineElems = [];
        for (let i = 0; i < lines.length; i++) {
            const wrap = document.createElement('div');
            wrap.className = 'code-line';
            wrap.textContent = lines[i];
            codeDisplay.appendChild(wrap);
            codeLineElems.push(wrap);
        }
    }
</script>

</body>
</html>
